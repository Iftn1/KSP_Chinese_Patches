@PART[ROE-SNTPPFE100]
{
    @title = abc
    @manufacturer = abc
    @description = “SNTP-PFE”系列是一款1000兆瓦反应堆。该反应堆采用颗粒床设计，将碳化金属包覆的铀颗粒嵌入石墨棒中，氢气从中流过，可实现高达40兆瓦/升的功率密度。其堆芯具备五次启动能力。反应堆集成钨硼氢化锂复合屏蔽层，整体采用再生冷却设计。二次回路通过小型热机处理停机气体，以最大限度减少燃料损失并提供基础交流发电机电力。该发动机应安装在距离最近燃料箱三至六米处。运行期间，燃料应对所有乘员形成屏蔽，且乘员位置应与发动机保持十至十五米距离。额外屏蔽措施（如水箱或高密度燃料）可适当缩短此距离。该火箭在同等尺寸下性能参数突出（喷管面积比=100，燃烧室温度=2720K，理论比冲=991秒，反应堆功率=1054兆瓦（热），推重比=13.94，燃烧室压力=6800千帕，点火次数=5次，含集成阴影屏蔽层总重=1.504吨）。喷管采用固定式烧蚀冷却碳-碳纤维缠绕设计。
}

