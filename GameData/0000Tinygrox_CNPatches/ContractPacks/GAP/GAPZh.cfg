// ============================================================================
//  GAP (Give Aircraft Purpose) 简体中文 —— ModuleManager 补丁（不改动原 mod 的任何文件）
//
//  字段值设为纯键 #LOC_GAPZh_*，中文在 Localization/zh-cn.cfg。
//  中文值里内嵌 @targetBody / @anomalyName 这类 CC 表达式：CC 会先解析
//  本地化键、再把结果当表达式求值，因此动态值不会丢失。
//
//  停用：删掉本文件夹即可（原 mod 文件自始至终未被改动）。
// ============================================================================

@AGENT[Giving?Aircraft?a?Purpose]:NEEDS[ContractPacks/GAP]
