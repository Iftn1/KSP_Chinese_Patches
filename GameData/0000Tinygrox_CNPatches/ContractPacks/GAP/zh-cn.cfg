		#LOC_GAPZh_shared_KSC_Airlines_is_proud_to_offer_air_trans_2 = KSC 航空荣幸地提供从 KSC 到甜品机场的航空运输服务。科学家和工程师常前往甜品机场开展各类考古与太空回收项目，而游客们都知道，甜品机场是全世界享用美味烧烤的最佳去处。&br;&br;运送乘客从 KSC 前往甜品机场，等待 30 秒上下客，然后起飞返回 KSC。
