		#LOC_GAPZh_GAP_Seaplane_completedMessage = 恭喜你又完成了一项航空史上的首创！你把自己的机构推上了 Kerbin 最受欢迎的机构之列。GAP 已将多位投资者提供的一笔资金计入你的账户，他们都看好你的机构的未来。
		#LOC_GAPZh_GAP_Seaplane_description = 到目前为止，你已经证明了自己飞机的适航性。但你能否改装它，或设计一架能在水面上降落的飞机？我们希望你尝试一项航空史上的首创——让飞机降落在水面上，然后再重新起飞。我们的工程师想给这样的设想取名叫水上飞机，他们认为如果这一设想能被证实，它对 KSC 的许多机构都会非常有用。
