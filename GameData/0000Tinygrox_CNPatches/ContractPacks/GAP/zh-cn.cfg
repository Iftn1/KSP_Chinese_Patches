		#LOC_GAPZh_Prototype_Marketplace_displayName = 原型市场
		#LOC_GAPZh_SSI_10000m_VesselParameterGroup_title = 飞到 10,000m
		#LOC_GAPZh_SSI_10000m_completedMessage = 你做到了！抵达 10,000m，你的飞行员还拍下了一张很棒的照片！&br;&br;趁你的飞行员在宇航员中心休息时，如果有兴趣，记得去任务控制中心找 Gene 了解另一个 SSI 的机会。
		#LOC_GAPZh_SSI_10000m_description = SSI 的 Inigma Kerman 希望你设计并驾驶一架能在 10,000m 高度飞行的飞机。他说，这样的成就会让未来的航空旅行更加安全，因为 Kerbin 上大多数恶劣天气都只发生在这个高度以下。他说，如果飞行员能直接飞越恶劣天气，而不是从中穿过，就能开启大量区域乃至全球航空旅行的可能性。
		#LOC_GAPZh_SSI_10000m_notes = 好好欣赏风景吧，在这个高度上，云层（如果今天能看到的话）大多会在你的飞机下方！
		#LOC_GAPZh_SSI_10000m_synopsis = 只需从跑道起飞一架飞机，爬升到 10,000m，然后安全返回 KSC 降落。
		#LOC_GAPZh_SSI_10000m_title = 驾驶飞机飞到 10,000m。
		#LOC_GAPZh_SSI_20000m_VesselParameterGroup_title = 飞到 20,000m
		#LOC_GAPZh_SSI_20000m_completedMessage = 你做到了！达到 20,000m！&br;&br;全球航空旅行已近在咫尺，许多新的机会也随之开启。回任务控制中心看看有什么新合同吧！
		#LOC_GAPZh_SSI_20000m_description = Maculator Kerman 又给你带来了一个新挑战，这一次很有可能开启常态化全球航空旅行的机会——达到 20,000m 的飞行高度。他说，实现这样的飞行高度将证明，就连 Kerbin 上最高的山峰也能被飞越，这将让 Kerbin 上几乎任何目的地都可以通过航空抵达！
		#LOC_GAPZh_SSI_20000m_notes = 好好欣赏风景吧，在这个高度上，Kerbin 的弧度清晰可见！
		#LOC_GAPZh_SSI_20000m_synopsis = 只需从跑道起飞一架飞机，爬升到 20,000m，然后安全降回 KSC。
		#LOC_GAPZh_SSI_20000m_title = 驾驶飞机飞到 20,000m。
		#LOC_GAPZh_SSI_35000m_VesselParameterGroup_title = 飞到 35,000m
		#LOC_GAPZh_SSI_35000m_completedMessage = 你做到了！达到 35,000m！上面的空气可真稀薄，对吧？别担心，任务控制中心这边有新鲜空气。&br;&br;干得漂亮！航天飞机的新前沿已经打开！
		#LOC_GAPZh_SSI_35000m_description = SSI 航天与坎巴拉太空计划已选定你的机构，为其提供专项资金，用来设计并试飞一架能抵达 35,000m 高空大气层的飞机。Inigma Kerman 解释说，完成这一壮举将开启令人兴奋的航天飞机研发新前沿！
		#LOC_GAPZh_SSI_35000m_notes = 好好欣赏风景吧，在这个高度上，你会觉得自己正触及太空的边缘！
		#LOC_GAPZh_SSI_35000m_synopsis = 只需从跑道起飞一架飞机，爬升到 35,000m，然后安全降回 KSC。
		#LOC_GAPZh_SSI_35000m_title = 驾驶飞机飞到 35,000m。
		#LOC_GAPZh_SSI_60000m_VesselParameterGroup_title = 飞到 60,000m
		#LOC_GAPZh_SSI_60000m_completedMessage = 你的航天飞机任务圆满成功！当你飞到 60,000m 以上时，任务控制中心一片欢腾；你着陆时，他们再次欢呼。赞美之词从四面八方涌来，你的机构也获得了一笔相当丰厚的奖励。
		#LOC_GAPZh_SSI_60000m_description = 坎巴拉太空计划希望 SSI 航天成为首家为其太空计划研制航天飞机的机构。Inigma Kerman 早就把你设成了快捷拨号，现在正请你的机构牵头这项前沿工作。&br;&br;Inigma 说，你需要研制一架航天飞机——它要能飞到大气层最高处，并能安全降落地面。可以说，60,000m 距离太空不过一步之遥。他说，坎巴拉太空计划已经批准：只要你愿意，这次飞行可以做成亚轨道飞行——前提是你的航天飞机设计得出来，不过完成任务并不要求这么做。
		#LOC_GAPZh_SSI_60000m_notes = 在 Kerbin 的高空之上，太空与大气在此交汇，群星在向你招手，你会意识到宇宙就在指尖。当然，前提是坎巴拉人除了大拇指之外还有别的手指。
		#LOC_GAPZh_SSI_60000m_synopsis = 只需从跑道起飞一架航天飞机，爬升到 60,000m，然后让航天飞机安全降落在任意地面上。你可以使用吸气式发动机、液体燃料发动机，或两者兼用。
		#LOC_GAPZh_SSI_60000m_title = 驾驶航天飞机飞到太空边缘！
		#LOC_GAPZh_SSI_Aerospace_description = 一家专注于开发与测试航空航天装备的工程合作社。
		#LOC_GAPZh_SSI_Mach1_All_VesselParameterGroup_title = 以超过 343 m/s 的速度飞行
		#LOC_GAPZh_SSI_Mach1_All_title = 突破音障
		#LOC_GAPZh_SSI_Mach1_completedMessage = 你突破了音障，达到了惊人的马赫 1！别担心，我们相信它很快就能修好，交给下一个人用！
		#LOC_GAPZh_SSI_Mach1_description = SSI 航天的首席科学家 Mach Kerman 和 KSP 退役试飞员 Yeager Kerman 希望推动 SSI 迈向航天飞机研发。但在那之前，SSI 的 Inigma Kerman 说他们得先掌握超音速飞行；为此，他请你的机构设计一架能在 20,000m 以下平飞突破音障的飞机。&br;&br;虽然完成这项挑战并不要求如此，但 Mach Kerman 相信，如果你设计飞机时用上那款正为太空计划研制的新型液体燃料火箭发动机，这次尝试或许会更容易成功。
		#LOC_GAPZh_SSI_Mach1_notes = 以前从没有人飞得比音速还快，所以大多数科学家和工程师都不知道该给你什么有用的建议。就算他们有建议，他们也担心你飞得太快，根本听不见。
		#LOC_GAPZh_SSI_Mach1_synopsis = 从跑道起飞一架飞机，在 2,500m 到 20,000m 之间飞行，平飞超过 343 m/s 并保持 5 秒，然后安全降回 KSC。
		#LOC_GAPZh_SSI_Mach1_title = 突破音障！
		#LOC_GAPZh_SSI_Mach2_All_VesselParameterGroup_title = 以超过 686 m/s 的速度飞行
		#LOC_GAPZh_SSI_Mach2_All_title = 达到马赫 2
		#LOC_GAPZh_SSI_Mach2_completedMessage = 哇！你做到了！你达到了马赫 2，还安全返航了！&br;&br;Inigma 把你的飞行数据交给了坎巴拉太空计划的 Gene Kerman，Gene 说他为你的成就感到非常骄傲，也非常高兴看到你和 SSI 航天携手合作。
		#LOC_GAPZh_SSI_Mach2_description = Mach Kerman 认为，以现有的液体燃料火箭技术，超越马赫 2（也就是两倍音速）是有可能的。做到这一点，就能让 SSI 朝航天飞机的研发再迈进一步。他希望你把飞机飞到 2,500m 以上、20,000m 以下，看看你能否在受控的平飞中安全超越马赫 2。
		#LOC_GAPZh_SSI_Mach2_notes = 飞马赫 1 很酷。飞马赫 2 会更酷。可惜，SSI 和 KSC 的科学家都预测，等你回来时要签的名也会翻倍。
		#LOC_GAPZh_SSI_Mach2_synopsis = 从跑道起飞一架飞机，在 2,500m 至 20,000m 之间飞行，以平飞状态超过 686 m/s 并保持 5 秒，然后安全降回 KSC。
		#LOC_GAPZh_SSI_Mach2_title = 达到马赫 2！
		#LOC_GAPZh_SSI_Mach3_All_VesselParameterGroup_title = 在 2500m 至 25,000m 之间飞行
		#LOC_GAPZh_SSI_Mach3_All_VesselParameterGroup_title_2 = 以超过 1029 m/s 的速度飞行
		#LOC_GAPZh_SSI_Mach3_All_title = 达到马赫 3
		#LOC_GAPZh_SSI_Mach3_completedMessage = 难以置信！你达到了马赫 3！&br;&br;Inigma Kerman 说，这次飞行让航天飞机计划朝现实迈出了关键的一步，同时还带来了坎巴拉太空计划提供的一笔可观的资金，他们将受益于你的飞行数据。
		#LOC_GAPZh_SSI_Mach3_description = Gene Kerman 希望 SSI 为太空计划研发超音速飞机。Inigma Kerman 想借此机会朝航天飞机的研发再迈进一步，并用 SSI 的又一次成功打动 Gene。因此，Inigma 请你的机构尝试一次超越马赫 3 的超音速试飞：把飞机飞到 2,500m 以上、25,000m 以下，在平稳、受控的飞行中安全超越马赫 3。Mach Kerman 已通知 SSI，这并不容易，因为在这个速度下预计会出现热效应；但 SSI 的每个人都相信，这一里程碑对航天飞机的研发是必要的——要成功，航天飞机就得飞得比马赫 3 快得多。
		#LOC_GAPZh_SSI_Mach3_notes = 马赫 3 绝对不酷。事实上，那是烈焰的门槛。撕扯你飞机的气动力会毫不留情，也绝不宽容。派一位勇敢的飞行员去，你清楚他在飞行中能保持冷静。
		#LOC_GAPZh_SSI_Mach3_synopsis = 从跑道起飞一架飞机，在 2,500m 至 25,000m 之间飞行，以平飞状态超过 1029 m/s 并保持 5 秒，然后安全降回 KSC。
		#LOC_GAPZh_SSI_Mach3_title = 达到马赫 3！
		#LOC_GAPZh_SSI_Mach4_All_VesselParameterGroup_title = 在 2500m 至 35,000m 之间飞行
		#LOC_GAPZh_SSI_Mach4_All_VesselParameterGroup_title_2 = 以超过 1372 m/s 的速度飞行
		#LOC_GAPZh_SSI_Mach4_All_title = 达到马赫 4
		#LOC_GAPZh_SSI_Mach4_completedMessage = 恭喜！你已达成马赫 4！&br;&br;Gene 说，坎巴拉太空计划及其合作机构对于通过航天飞机进入太空这件事是认真的，他们很快就会指望 SSI 和你的机构来实现这一目标。
		#LOC_GAPZh_SSI_Mach4_description = Gene Kerman 想看看 SSI 航天和你的机构能否完成空速计划的最后一段，并为飞机热效应以及飞机在高超音速下的操纵性收集数据。多快？马赫 4。Inigma Kerman 告诉 Gene，SSI 及其伙伴做得到。他希望你们接下这最后一项空速挑战，看看能否让飞机在 2,500m 以上、35,000m 以下以平飞达到马赫 4。如果能做到，那就为不久后研发航天飞机原型机打开了大门。
		#LOC_GAPZh_SSI_Mach4_notes = 四倍音速听起来……呃，看上去并不比三倍音速快多少。除非你是一颗流星——在这次任务的某个时刻，地面上的某个人说不定真会把你当成一颗流星。祝你好运！
		#LOC_GAPZh_SSI_Mach4_synopsis = 从跑道起飞一架飞机，在 2,500m 到 25,000m 之间飞行，在平飞状态下以超过 1372 m/s 的速度飞行 5 秒，然后安全地降落在任意地点并停稳。
		#LOC_GAPZh_SSI_Mach4_title = 达到马赫 4！
		#LOC_GAPZh_SSI_Tesla_Battery_completedMessage = 零件移交完成。&br;&br;你的机构现在可以使用以下内容：&br;&br;- Z-100 Rechargeable Battery Pack&br;&br;好好享受这个新零件吧！
		#LOC_GAPZh_SSI_Tesla_Battery_description = 你好，我叫 Nikola Kerman，是 Tesla Electrics 的老板。我们发明了一项技术，可以用于开发简易的电动载具！&br;&br;你可以购买这款已可投产的原型产品，它将让你能够开始制造电动载具：&br;&br;- Z-100 Rechargeable Battery Pack
		#LOC_GAPZh_SSI_Tesla_Battery_title = 购买电池技术
		#LOC_GAPZh_Wright_2500m_VesselParameterGroup_title = 飞到 2,500m
		#LOC_GAPZh_Wright_2500m_completedMessage = 又一次历史性飞行完成了！&br;&br;从刚才那次着陆来看，你的飞行员开始展现出一些惊人的技术了。
		#LOC_GAPZh_Wright_2500m_description = 起飞和着陆很容易。用吸气式发动机飞到 2,500m，再飞回跑道降落……那就是完全另一回事了。Wilbur Kerman 说跑道就是未来的道路，还说你的飞行员最好习惯在跑道上降落。
		#LOC_GAPZh_Wright_2500m_notes = 好好欣赏风景吧！
		#LOC_GAPZh_Wright_2500m_synopsis = 只需从跑道起飞一架飞机，飞到 2,500m，然后安全地飞回跑道降落。
		#LOC_GAPZh_Wright_2500m_title = 驾驶飞机飞到 2,500m。
		#LOC_GAPZh_Wright_5000m_VesselParameterGroup_title = 飞到 5,000m
		#LOC_GAPZh_Wright_5000m_completedMessage = 5,000m，而且你没撞上鸟！干得漂亮！&br;&br;遗憾的是，上一位挑战这项壮举的飞行员也说了同样的话，随后他就从 4,500m 失控螺旋坠落，在管理大厦附近留下了一个大坑。&br;&br;正当 Gene Kerman 准备把这个大坑改建成一座航空先驱纪念池时，Orville Kerman 和 Inigma Kerman 都祝贺你安全返航。Inigma 说，如果你有兴趣，GAP 在任务控制中心还为你准备了一项挑战。
		#LOC_GAPZh_Wright_5000m_description = Orville Kerman 说，现在应该有可能用一架吸气式飞机去挑战 5,000m 的高度纪录了。他说莱特航空已经得知，本地一家报纸悬赏奖励第一个达到 5,000m 飞行高度的机构，他认为你的机构或许能胜任这项任务。
		#LOC_GAPZh_Wright_5000m_notes = 好好欣赏风景吧，在这个高度，地面的东西真的开始显得很小了！
		#LOC_GAPZh_Wright_5000m_synopsis = 只需从跑道起飞一架飞机，飞到 5,000m，然后安全地飞回 KSC 降落。
		#LOC_GAPZh_Wright_5000m_title = 驾驶飞机飞到 5,000m。
		#LOC_GAPZh_Wright_Aeronautical_description = 为公众提供乘机飞行服务，并发布航空表演特技合同。
		#LOC_GAPZh_Wright_Aeronautical_title = 莱特航空
		#LOC_GAPZh_Wright_Bail_Any_title = 然后着陆并让飞机停稳
		#LOC_GAPZh_Wright_Bail_VesselParameterGroup_HasCrew_title = 以及一名跳伞志愿者
		#LOC_GAPZh_Wright_Bail_VesselParameterGroup_KerbalDeaths_title = 不造成重伤
		#LOC_GAPZh_Wright_Bail_VesselParameterGroup_title = 飞到 2500m 以上
		#LOC_GAPZh_Wright_Bail_VesselParameterGroup_title_2 = 让跳伞者离开飞机
		#LOC_GAPZh_Wright_Bail_VesselParameterGroup_title_3 = 并让跳伞者安全着陆
		#LOC_GAPZh_Wright_Bail_completedMessage = 你从飞机上跳了下去，还活着！&br;&br;看来你的特技表演成功引起了 Corliss Paraventures 的兴趣。请前往任务控制中心了解更多详情。
		#LOC_GAPZh_Wright_Bail_description = SSI 的安全工程师 Garnerin Kerman 认为，靠他所说的“降落伞”从遇险的飞机上跳下来是有可能生还的。但他也纳闷：为了测试它，你为什么偏要跳出一架完好无损的飞机？他说，如果你真要做这件事，就得先签一份免责声明，免得他背上“测试失败”的黑锅。莱特航空的 Orville Kerman 说：“这个想法从没被验证过……除了那次有人裹着床单从楼顶上跳下去。”他说只要你有一套靠谱的实施方案，他暂且愿意为这个点子撑腰。“不用说，”他接着说，“上次用床单的那次尝试可不太成功。可怜的小伙子。”
		#LOC_GAPZh_Wright_Bail_notes = 尽情享受自由落体吧！建议你采纳 Garnerin 的主意，给你的志愿者配一具降落伞，否则自由落体的快感在着陆时可能就完全反过来了。要是你手头没有降落伞，Jebediah Kerman 曾悄悄跟 Orville 说，EVA 头盔也可以当作一种着陆替代方案，但 Orville 只是狠狠地瞪了他一眼，摇了摇头，然后转身回机库去了。
		#LOC_GAPZh_Wright_Bail_synopsis = 只要驾驶一架飞机升空，机上带一名飞行员和一名跳伞志愿者，然后飞到 2500m 以上，让你的志愿者从这架完好无损的飞机上跳出去。最后把飞机安全降回 KSC。
		#LOC_GAPZh_Wright_Bail_title = 从飞机上跳下去！
		#LOC_GAPZh_Wright_BarnstormIsland_VesselParameterGroup_title = 在 1 号机库进行特技飞行
		#LOC_GAPZh_Wright_BarnstormIsland_VesselParameterGroup_title_2 = 在 2 号机库进行特技飞行
		#LOC_GAPZh_Wright_BarnstormIsland_WaypointGenerator_Hangar_1_name = 1 号机库
		#LOC_GAPZh_Wright_BarnstormIsland_WaypointGenerator_Hangar_2_name = 2 号机库
		#LOC_GAPZh_Wright_BarnstormIsland_completedMessage = 你做到了！&br;&br;小岛机场的地勤人员把你这次成功特技的故事讲给了他们认识的每一个人。Gene 说，如果你哪天做特技做腻了，只要你有兴趣，任务控制中心还有更重要的活儿等着你。
		#LOC_GAPZh_Wright_BarnstormIsland_description = Jebediah 认为低空特技穿越小岛机场机库完全可行，而且看起来比穿越他的棚屋容易得多。Gene 勉强批准了这个想法，并已清空了小岛上空的全部空中交通，直到你完成这次特技为止。莱特航空觉得这又是一次检验你飞行员驾驶技术的好机会，但提醒你不要提前通知媒体。
		#LOC_GAPZh_Wright_BarnstormIsland_synopsis = 去低空特技穿越小岛机场的一座机库。如果你还能穿越第二座机库，可获得额外声望奖励。
		#LOC_GAPZh_Wright_BarnstormIsland_title = 低空特技穿越小岛机场机库！
		#LOC_GAPZh_Wright_BarnstormRD_BarnstormTunnel_title = 从研发中心隧道下方飞过
		#LOC_GAPZh_Wright_BarnstormRD_VesselParameterGroup_title = 从研发中心人行桥下方飞过
		#LOC_GAPZh_Wright_BarnstormRD_WaypointGenerator_R_D_Center_Pedestrian_Bridge_name = 研发中心人行桥
		#LOC_GAPZh_Wright_BarnstormRD_WaypointGenerator_R_D_Center_Tunnel_name = 研发中心隧道
		#LOC_GAPZh_Wright_BarnstormRD_completedMessage = 哇！你做到了！看到的人都很佩服。干得漂亮！Gene 说，如果你哪天做特技做腻了，只要你有兴趣，任务控制中心还有一些重要的活儿等着你。
		#LOC_GAPZh_Wright_BarnstormRD_description = 在研发中心的人行桥和隧道里进行特技飞行？Jebediah 觉得这能行。Gene 已经批准了这次尝试。莱特航空认为这说不定哪天能促成一场飞行表演。至少眼下，摄像机不会开机，以防……呃……你懂的。因此，为了规避责任，这完全是一次自筹资金的冒险，但如果你把这两项都完成，你将获得相当可观的声望和飞行员经验。
		#LOC_GAPZh_Wright_BarnstormRD_synopsis = 去研发中心人行桥进行特技飞行。如果你还能在隧道里也来一次特技飞行，可获得额外声望奖励。
		#LOC_GAPZh_Wright_BarnstormRD_title = 在研发中心进行特技飞行！
		#LOC_GAPZh_Wright_FirstFlight_VesselParameterGroup_title = 你的飞行器必须
		#LOC_GAPZh_Wright_FirstFlight_completedMessage = 恭喜！飞行成功了！&br;&br;幸好唯一回应新闻邀请的那位记者用相机拍下了这次历史性飞行。他关于你这次飞行的报道已被数百万人读到，如今你已激发了各地坎巴拉人的想象力。
		#LOC_GAPZh_Wright_FirstFlight_description = 多亏了你的机构的研究努力，我们终于研发出了一台足够轻、可以安装到滑翔机上的吸气式发动机，让可控的动力飞行成为可能！&br;&br;以往把固体火箭用在滑翔机上的尝试，往往以灾难和志愿者稀缺告终。莱特航空想请你与他们合作，用一台吸气式发动机建造并测试一架飞行机器。你的飞行机器必须有机翼才能控制飞行，而且必须能够安全着陆。&br;&br;这是一片全新的疆域，此前已有许多人失败，所以目前没有任何投资资金可以给你。莱特航空愿意承担人工成本、零食，并通知媒体；但你得自掏腰包购置这个项目所需的零件。如果你成功了，你的飞行员将获得宝贵的飞行技能，你的机构也将闻名世界。
		#LOC_GAPZh_Wright_FirstFlight_notes = Wilbur 和 Orville 两人都想去，可他们抛的那枚硬币却立在了边上——所以他们才会请你派一名志愿者来驾驶这台古怪的机器。
		#LOC_GAPZh_Wright_FirstFlight_synopsis = 是时候造一架飞行机器了——一架能向全世界证明可控动力飞行确实可行的飞行机器！
		#LOC_GAPZh_Wright_FirstFlight_title = 建造并试飞你的第一架飞机！
		#LOC_GAPZh_Wright_Glider_VesselParameterGroup_All_title = 发射后不携带任何发动机
		#LOC_GAPZh_Wright_Glider_VesselParameterGroup_PartValidation_title = 有指令座椅
		#LOC_GAPZh_Wright_Glider_VesselParameterGroup_title = 你的滑翔机必须
		#LOC_GAPZh_Wright_Glider_completedMessage = 滑翔机试飞成功！&br;&br;你居然还能安全着陆，这就更了不起了。
		#LOC_GAPZh_Wright_Glider_description = Wilbur Kerman 和 Orville Kerman 一直在监管 GAP 的飞行器项目，并成立了一家名为莱特航空的新创公司，以探索动力飞行的前沿。作为起步，他们希望你研制一架原型滑翔机，用来验证几项飞行控制概念。你的滑翔机必须有指令座椅、用于控制飞行的机翼，并且能够安全着陆。&br;&br;如何把滑翔机弄上天，全凭你的想象力，不过 Jebediah Kerman 推荐久经考验的固体火箭方案。或者从悬崖上跳下去也行。随你选。无论你决定怎么做，只要确保你的飞行员活下来——我们可不想在项目刚开始就惹上负面新闻。要算作真正的滑翔机，你需要把决定使用的任何助推器分离掉。
		#LOC_GAPZh_Wright_Glider_notes = Jebediah 暗示，如果你决定采用固体火箭助推起飞，最好带上分离固体火箭的装置，让飞行更平稳。
		#LOC_GAPZh_Wright_Glider_synopsis = 造一架滑翔机并不难。但要让它离开地面，就是个挑战了。
		#LOC_GAPZh_Wright_Glider_title = 建造并试飞一架滑翔机！
		#LOC_GAPZh_Wright_Speed100_All_VesselParameterGroup_title = 以超过 100 m/s 的速度飞行
		#LOC_GAPZh_Wright_Speed100_All_title = 达到 100 m/s 的最大空速
		#LOC_GAPZh_Wright_Speed100_completedMessage = 恭喜，你创下了 100 m/s 的新空速纪录！&br;&br;你证实了 Kurtis Kerman 关于高速飞行的理论，也为莱特航空再添了一份名声与声望。赞助商们开始打听该如何支持这片新的空速前沿。去任务控制中心看看，莱特航空是否还有另一份合同在等着你！
		#LOC_GAPZh_Wright_Speed100_description = Kurtis Kerman 是 Wilbur Kerman 的朋友，他认为飞机只要设计得当，就应该能超过最快地面载具的速度，而且不必俯冲向下就能做到。莱特航空有兴趣帮忙证明这是可行的（我们希望你知道这里的“这”指的是什么）。他们希望你驾驶一架吸气式飞机升到 2,500m 以上、5,000m 以下，看看能否在受控平飞中安全超过 100 m/s，从而打破当前的载人载具速度纪录。
		#LOC_GAPZh_Wright_Speed100_title = 达到 100 m/s 的空速
		#LOC_GAPZh_Wright_Speed220_All_VesselParameterGroup_title = 以超过 220 m/s 的速度飞行
		#LOC_GAPZh_Wright_Speed220_All_title = 达到 220 m/s 的最大空速
		#LOC_GAPZh_Wright_Speed220_completedMessage = 恭喜，你创造了 220 m/s 的新空速纪录，并且活着回来了！&br;&br;你成功应对了莱特航空的空速挑战，Inigma Kerman 因此点名找你，看你能否帮助 GAP 攻克有史以来最大胆的空速挑战之一。详情请到任务控制中心查询。
		#LOC_GAPZh_Wright_Speed220_description = Kurtis Kerman 现在是莱特航空的工程师同行，他认为只要对现有的飞机设计再做一些微调，就有可能在平飞中超过 220 m/s。多位赞助商给了 GAP 一笔钱来促成此事，只要你接下这份合同，Inigma Kerman 非常乐意把它全部转给莱特航空，再送到你的机构手里！&br;&br;不过尝试高速飞行可不是胆小者能干的。有飞行员报告，俯冲接近高速时飞机会剧烈抖动，还有些飞机在超过 220 m/s 时因气动力而解体。Inigma 希望你能成为第一个把吸气式飞机升到 2,500m 以上、5,000m 以下，并在受控平飞中超过 220 m/s、然后安全返航的人。这么做会让赞助商获得相当不错的投资回报，也让资金进到你的口袋里。
		#LOC_GAPZh_Wright_Speed220_title = 达到 220 m/s 的空速
