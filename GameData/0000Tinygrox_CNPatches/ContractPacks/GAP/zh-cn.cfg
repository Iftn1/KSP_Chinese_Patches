		#LOC_GAPZh_GAP_Loan_completedMessage = 你的 £ @/principal.Print() 贷款已还清，但因为你等待了超过 @/period 天才还清欠款，需支付 @/posInterest% 的利息费用，共计 £ @/interestPayment.Print()。希望你在此期间已经把财务状况重新整理好了！将来如果还需要我们，我们随时都在。
		#LOC_GAPZh_GAP_Loan_description = 在 GAP 航天，我们照顾自己人。我们注意到你的资金有点紧张，与其看着你破产，我们愿意从 GAP 风险投资基金为你的机构提供一笔贷款。我们相信你有能力扭转局面，所以如果你接受这项提议，我们觉得你会从中受益。\n\n贷款金额：£ @/principal.Print() 资金。\n\n期限：@/period 天\n\n利息费用：@/posInterest% 或 £ @/interestPayment.Print() 资金。\n\n到期应付总额，期限 @/period 天：£ @/posPayment.Print() 资金。\n\n本贷款在期限内免息。提前还清本贷款不会被收取任何罚金。
