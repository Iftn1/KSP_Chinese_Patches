		#LOC_GAPZh_CoastGuard_RescueClimbers_Easy_description = KSC 海岸警卫队接到了 Kerbin Peak Mountain Trail Ranger Station 打来的紧急求助电话。&br;&br;据报有两名登山者分别被困在 K2 山脉相对的两座山峰上，起因是他们争论 K2 到底哪一面才是正确的上山方向。显然其中一人带着绳索，另一人带着挂钩，如今两人都需要救援。派出一支搜救队去营救这两名登山者，并将他们送回海岸警卫队着陆区安全回收。Lt. Dan Kerman 已指派登山专家 Ens. Joe Kerman 参与此次任务，协助回收登山者。
		#LOC_GAPZh_CoastGuard_RescueClimbers_Easy_notes = 前往 K2 山脉各自的位置营救登山者 @/kerbalsInDistress.ElementAt(0) 和 @/kerbalsInDistress.ElementAt(1)，并将他们带回任意 KSC 海岸警卫队救援站安全回收。
